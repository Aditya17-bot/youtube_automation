# Footage bank for the `clips_short` channel.
#
# This file is a LICENCE WHITELIST, not a wishlist. `core/footage.py` refuses to
# download an entry whose `license` is not in core.footage.ALLOWED_LICENSES, and
# then refuses again if archive.org's own metadata disagrees with what is
# claimed here. Both checks have to pass before a byte is written to disk.
#
# Why the gate is this strict: YouTube enforces the reused-content and
# inauthentic-content policies at the CHANNEL level, and this channel uploads to
# the same account as Nightfall Archive. One unlicensed source could cost the
# whole channel its monetisation, which is a far worse outcome than a thin week
# of footage.
#
# Non-commercial licences are rejected on purpose. `TheLastManOnEarth` on
# archive.org carries CC BY-NC, so a monetised Short cut from it breaches the
# licence even though the film is widely called public domain. It is a tempting
# source and it is not usable; test_footage.py pins that rejection.
#
#   python -m core.footage fetch --source carnival_of_souls
#   python -m core.footage index --source carnival_of_souls
#   python -m core.footage contact --source carnival_of_souls
#   python -m core.footage runway
#
# `skip_head` / `skip_tail` are seconds cut off each end before shots are
# offered. Titles, studio logos and end credits are all on-screen text, and a
# Short whose picture carries someone else's title card reads as a reupload.

brief: >-
  Public-domain horror footage, biased towards silent film. A silent source has
  no dialogue to fight with our narrator, its faces are lit theatrically, and it
  looks nothing like anything else in the feed - which is the whole point, since
  the channel lost its audience by looking like a slideshow.

sources:
  # The best single source here. Dreamlike rather than gory: pale faces,
  # abandoned pavilion, long empty roads. Cuts well against first-person dread.
  - id: carnival_of_souls
    kind: archive
    ref: CarnivalofSouls
    title: "Carnival of Souls (1962)"
    license: public-domain
    license_proof: https://archive.org/details/CarnivalofSouls
    skip_head: 180
    skip_tail: 150

  # Silent, expressionist, no dialogue at all. Painted shadows and impossible
  # architecture: every frame looks wrong in a way that needs no explanation.
  - id: caligari
    kind: archive
    ref: DasKabinettdesDoktorCaligariTheCabinetofDrCaligari
    title: "The Cabinet of Dr. Caligari (1919)"
    license: public-domain
    license_proof: https://archive.org/details/DasKabinettdesDoktorCaligariTheCabinetofDrCaligari
    skip_head: 120
    skip_tail: 120

  # A 1922 pseudo-documentary on witchcraft. Genuinely unsettling imagery and
  # tinted stock, which grades to something that does not look like film at all.
  - id: haxan
    kind: archive
    ref: Haxan_tinted_and_subtitled
    title: "Haxan (1922)"
    license: public-domain
    license_proof: https://archive.org/details/Haxan_tinted_and_subtitled
    skip_head: 240
    skip_tail: 180

