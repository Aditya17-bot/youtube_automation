  # Held back deliberately. The film is genuinely public domain - the 1968
  # release went out without a copyright notice - but it is the single most
  # aggregated PD title on YouTube, and Content ID claims on it come from
  # rights-holders of *restorations* rather than of the film. Enable it only
  # once the channel can afford to argue a claim.
  # - id: night_of_the_living_dead
  #   kind: archive
  #   ref: night_of_the_living_dead_dvd
  #   title: "Night of the Living Dead (1968)"
  #   license: public-domain
  #   license_proof: https://archive.org/details/night_of_the_living_dead_dvd
  #   skip_head: 200
  #   skip_tail: 200

  # Prelinger texture. Short films, so the shot yield is small, but 1950s
  # civil-defence and hygiene footage graded cold is the analog-horror look -
  # ordinary people doing ordinary things, and something wrong with the film.
  # Half of this film is children in classrooms, and the channel's own rules bar
  # children as victims. The narration cannot break that rule - it is checked -
  # but the PICTURE can imply it, so those shots were blacklisted by hand after
  # reading the contact sheet:
  #
  #   python -m core.footage drop --source duck_and_cover
  #       --shots 2,5,6,7,8,9,13,14,15,16,17,18,19,20,21,23,26,27
  #
  # That leaves 17 adult shots - two videos - and it is the reason `plan()`
  # tolerates gaps: after the drop there was no run of eight in a row left
  # anywhere in the film.
  - id: duck_and_cover
    kind: archive
    ref: DuckandC1951
    title: "Duck and Cover (1951)"
    license: public-domain
    license_proof: https://archive.org/details/DuckandC1951
    skip_head: 45
    skip_tail: 30
