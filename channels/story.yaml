# Horror channel: original atmospheric fiction, AI images with slow camera moves.
#
# Deliberately FICTION, and enforced as such (formats/story.py rejects
# "based on a true story" and friends). Passing invented horror off as real is
# deceptive and is exactly the fabricated-content pattern that costs channels
# their monetisation.
#
# Dread comes from restraint, not gore: graphic content is both demonetised and
# unnecessary for the format.
name: "Nightfall Archive"
format: story
auto_publish: true
privacy: private
cta: "Subscribe to Nightfall Archive for a new story every week."

script:
  mode: fiction
  # 590 words over 28 beats measures 4.6 min. The old [560, 700] with a 320 s
  # ceiling allowed 5.2, which is past the 5 min this channel is meant to hold.
  target_words: [480, 590]
  duration_range: [230, 300]      # hard ceiling; core.assemble enforces it
  beats: [20, 28]
  tone: >-
    quiet, controlled dread; a narrator who is calm even when the story is not.
    Slow build, concrete sensory detail, no jump-scare punctuation, no shouting
  audience: "adults who like slow-burn horror, liminal spaces and unresolved endings"

voice:
  provider: edge-tts
  name: en-US-BrianMultilingualNeural
  rate: "-10%"                    # slower than the finance read: dread needs air
  pitch: "-4Hz"
  # Measured, not assumed - see core.script.words_per_minute. Re-derive with
  # `python -m core.voice --measure --channel story` if the voice or rate moves.
  words_per_minute: 134

video:
  width: 1920
  height: 1080
  fps: 30
  encoder: h264_nvenc

style:
  background: "#050607"
  surface:    "#0D0F11"
  text:       "#DCD8D2"
  muted:      "#7A756E"
  accent:     "#8B1E1E"
  accent_alt: "#4A5A63"
  grid:       "#15181B"
  image_style: >-
    cinematic horror still, near-monochrome desaturated palette, deep shadows,
    heavy fog, single weak practical light source, cold blue-grey with faint
    sodium glow, 35mm film grain, shallow depth of field, empty and still,
    unsettling, no people visible, no text

music:
  enabled: true
  gain_db: -24                    # quieter bed: silence is part of the genre
  target_lufs: -14

captions:
  enabled: true
  max_chars: 44

thumbnail:
  scrim: 0.86
  # Kept short: CLIP truncates past 77 tokens, and the prompt matters more
  # than the style suffix.
  style: "cinematic horror photo, desaturated, deep blacks, fog, film grain"
  # Picked deterministically per topic, so a channel looks like one series while
  # no two videos share a thumbnail.
  prompts:
    - "a pale translucent ghostly figure standing far down a dark motel corridor, one flickering fluorescent tube, thick fog"
    - "a spectral woman in a white dress dissolving into mist at the foot of a wooden staircase, moonlight through a broken window"
    - "a faint humanoid shape forming in heavy fog on an empty road at night, single sodium streetlamp"
    - "a shadowy apparition reflected in an antique mirror in an unlit room, candle flame, dust suspended in the air"
    - "a translucent silhouette standing in a doorway backlit by cold blue light, long empty hallway"
    - "a ghostly face pressed faintly against a rain-streaked window at night, porch light, empty road beyond"
    - "an empty rocking chair in a derelict room with a pale figure barely visible in the shadows behind it"
    - "a white shrouded figure standing waist-deep in fog in a field at night, distant farmhouse light"

cadence:
  per_week: 2
