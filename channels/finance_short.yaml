# Vertical Shorts. The only format this channel publishes.
#
# The long-form explainers were retired: they settled at single-digit views
# while the Shorts cleared 500+ each, so the whole budget goes here.
#
# `youtube_account: finance` is the OAuth identity, not a parent channel - it
# keeps uploading with the token that is already authorised
# (secrets/token_finance.json) rather than forcing a re-auth.
#
# `script.topics_from: finance` names the topic BANK (channels/topics_finance.yaml),
# which is not tied to a channel config.
name: "Simple Money"
format: finance
youtube_account: finance         # uploads with secrets/token_finance.json
auto_publish: true
privacy: public   # Shorts go straight out; there is no second review step
cta: "Subscribe for one money idea a day."

script:
  topics_from: finance           # reads channels/topics_finance.yaml
  target_words: [95, 125]        # 125 words over 9 beats measures 51 s
  duration_range: [35, 52]       # under 60 s or YouTube stops calling it a Short
  beats: [6, 9]
  tone: "quick, plain, one idea only; no preamble, no sign-off"
  audience: "Indian beginners scrolling on a phone"
  structure:
    - {id: hook,     start: 0,  end: 4,  intent: "one blunt question or claim that stops the scroll"}
    - {id: lesson,   start: 4,  end: 42, intent: "the single idea, shown with one number or one chart"}
    - {id: takeaway, start: 42, end: 52, intent: "the one-line rule, then a one-beat subscribe nudge"}

voice:
  provider: edge-tts
  name: en-US-AvaMultilingualNeural
  rate: "+8%"
  pitch: "+0Hz"
  words_per_minute: 164   # measured against the finished Short

video:
  width: 1080
  height: 1920
  fps: 30
  encoder: h264_nvenc

style:
  background: "#0E1116"
  surface:    "#161B22"
  text:       "#E6EDF3"
  muted:      "#8B949E"
  accent:     "#4ADE80"
  accent_alt: "#F87171"
  grid:       "#232A33"

thumbnail:
  scrim: 0.80
  style: "cinematic editorial photo, teal and amber grade, premium, sharp"
  prompts:
    - "a confident young businessman in a sharp navy suit on a rooftop at night, city lights below, dramatic rim lighting"
    - "a man in a dark tailored suit seen from behind facing a wall of glowing financial charts in a dark room"
    - "a stylish man in a charcoal suit at a minimal desk with a laptop, warm morning window light"

music:
  enabled: true
  gain_db: -19
  target_lufs: -14

captions:
  enabled: true
  max_chars: 26

affiliate:
  associate_tag: ""              # set after Amazon Associates approval
  marketplace: in
  hub_url: ""
  picks:
    - {name: "Personal finance books", why: "The ideas in these videos, at book length.", search_query: "personal finance books india beginners"}
    - {name: "Budget planner notebook", why: "Writing spending down beats any app, for most people.", search_query: "budget planner notebook expense tracker"}
    - {name: "Document organiser box", why: "Somewhere for policies and tax papers to live.", search_query: "document organizer file storage box"}

cadence:
  per_week: 5
