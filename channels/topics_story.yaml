# Original horror premises. Each is a situation, not a plot - the script
# invents the events. Nothing here references a real place, person or death.
# Read by core.topicgen when it extends this bank. It is the whole instruction
# the generator gets about what belongs here, so it has to carry the editorial
# rules, not just the genre.
brief: >-
  Original horror premises for 45-55 second vertical Shorts. Each topic is a
  SITUATION, not a plot: a specific job, place or routine, plus one thing about
  it that is wrong. The script invents what happens. Quiet dread over gore,
  no monsters named, no jump-scare framing. Nothing may reference a real place,
  person, brand or death. Ordinary night work is the richest seam - people
  alone with a procedure that has started disagreeing with them.

