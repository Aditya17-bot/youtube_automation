# Vertical horror Shorts. The only format this channel publishes.
#
# The long-form stories were retired at 0-2 views each while these Shorts clear
# 500+, so Nightfall Archive is now a Shorts channel and nothing else.
#
# `youtube_account: story` is the OAuth identity, not a parent channel - it
# keeps the already-authorised token (secrets/token_story.json) in use.
# `script.topics_from: story` names the topic BANK
# (channels/topics_story.yaml), which is not tied to a channel config.
#
# A Short is now a whole piece, not a teaser: one scene, one turn, and it has
# to land on its own because there is no longer a full video to send anyone to.
name: "Nightfall Archive"
format: story
youtube_account: story           # uploads with secrets/token_story.json
auto_publish: true
privacy: public   # Shorts go straight out; there is no second review step
cta: "Subscribe to Nightfall Archive for a story every night."

script:
  mode: fiction
  topics_from: story           # reads channels/topics_story.yaml
  target_words: [80, 110]        # 110 words over 12 beats measures 53 s
  duration_range: [40, 55]       # under 60 s or YouTube stops calling it a Short
  beats: [8, 12]
  tone: >-
    one scene, one turn, no resolution. Present tense where it helps. End on the
    image, not an explanation. It is the whole piece, not a trailer: nothing may
    depend on a longer version existing
  audience: "horror viewers scrolling at night"

voice:
  # azure, not edge-tts, for one reason: express-as. A horror Short lives or
  # dies on delivery, and edge-tts reads every line at the same temperature.
  # The script now carries a [whispering] / [terrified] tag before each
  # sentence and core.voice turns those into SSML spans.
  #
  # Not free in principle, free in practice: the F0 tier covers 500k characters
  # a month and three Shorts a day spend about 72k. Set AZURE_SPEECH_KEY and
  # AZURE_SPEECH_REGION, or write secrets/azure_speech.json. With neither, the
  # run falls back to edge-tts and reads the script flat rather than failing.
  provider: azure
  # Brian Multilingual supports no styles at all. Guy does - terrified,
  # whispering, sad, unfriendly, shouting - and, unlike Davis, he also exists
  # on the free edge-tts endpoint, so a run that loses the key keeps the
  # channel's voice and only loses the acting.
  # `python -m core.voice --styles` lists what the account really offers.
  name: en-US-GuyNeural
  fallback_name: en-US-GuyNeural   # must be a voice edge-tts actually serves
  default_style: whispering   # applies until the first tag in a beat
  style_degree: 1.3           # 0.01-2; above ~1.5 Davis starts to sound comic
  rate: "-4%"
  pitch: "-4Hz"
  # Re-measure after the voice change: `python -m core.voice --measure`.
  # 143 was Brian's figure and Davis will not match it.
  words_per_minute: 143

video:
  width: 1080
  height: 1920
  fps: 30
  encoder: h264_nvenc

style:
  background: "#050607"
  surface:    "#0D0F11"
  text:       "#DCD8D2"
  muted:      "#7A756E"
  accent:     "#8B1E1E"
  accent_alt: "#4A5A63"
  grid:       "#15181B"
  image_style: >-
    cinematic horror still, desaturated, deep shadows, fog, single weak light,
    35mm grain, empty, unsettling, no people, no text

thumbnail:
  scrim: 0.86
  # The thumbnail is a woman's face, every time. It is the one thing that
  # reliably stops a thumb at feed size, and a face is the reason to click where
  # an empty corridor is not - the in-video art stays people-free.
  face: true
  anchor_y: 0.22      # keep the head high; the headline owns the bottom third
  # CLIP truncates at 77 tokens and everything past that is silently discarded,
  # so every line here is kept short: subject + lighting + style + setting has
  # to fit inside that budget or the tail stops affecting the image at all.
  style: "horror portrait photo, close up, sharp focus on the eyes, desaturated, deep blacks, film grain"
  # Combined one axis at a time (see core.thumbnail.pick_prompt): 10 x 8 x 6
  # combinations, so no two videos in a month share a picture while every one of
  # them is unmistakably this channel.
  subjects:
    - "a gaunt pale woman, wet black hair over half her face, one eye staring into the lens"
    - "a woman's face, eyes rolled back to solid white, mouth slightly open"
    - "a woman in a filthy white nightgown, head tilted too far sideways, hair across her mouth"
    - "a woman's grey face pressed against cracked glass, breath fogging it"
    - "a woman with hollow black eye sockets, cracks across porcelain-white skin"
    - "a drowned woman, matted hair on her cheeks, water running off her chin, eyes open"
    - "a veiled woman in black lace, faint knowing smile, half her face in shadow"
    - "an old woman in silent mid-scream, tendons standing out in her neck"
    - "a woman's ash-grey face out of the dark, pupils enormous, unblinking"
    - "a young woman with stitched-shut eyes, calm, face turned to the lens"
  settings:
    - "in an unlit corridor"
    - "in heavy fog on a night road"
    - "in a derelict bedroom, peeling wallpaper"
    - "behind a rain-streaked window"
    - "in a flooded basement, black water"
    - "among bare trees, dark forest"
    - "in an abandoned hospital ward"
    - "in a dusty attic, dust sheets"
  lighting:
    - "one flickering bulb overhead, hard shadows under the eyes"
    - "cold moonlight on one side, the other side black"
    - "harsh flashlight from below"
    - "dim red emergency light"
    - "a single candle against darkness"
    - "sodium streetlamp behind her, rim light on her hair"

music:
  enabled: true
  gain_db: -22
  target_lufs: -14

captions:
  enabled: true
  max_chars: 26

cadence:
  # per_week picks WHICH days run (7 = every day), per_day how many videos on
  # each of those days. Three is what one machine gets through comfortably in a
  # night; raise it only after watching a run finish inside its window, since
  # every extra video is another full render plus another upload against the
  # day's API quota.
  per_week: 7
  per_day: 3
